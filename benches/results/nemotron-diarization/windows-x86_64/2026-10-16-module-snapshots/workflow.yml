name: Diarization Windows container prerequisites
on:
  push:
    branches: [codex/nemotron3-windows-probe]
    paths: ['.github/workflows/diarization-windows-preflight.yml', 'tools/nemotron-diarization/windows_container_preflight.py', 'tools/nemotron-diarization/windows_container_smoke.py', 'tools/nemotron-diarization/windows_smoke_controls.ps1', 'tools/nemotron-diarization/windows-container.lock.json', 'examples/support/windows_modules.rs']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Preserve byte-pinned source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and exercise actual Win32 module snapshots and Unicode relocation
        run: |
          rustc --edition=2024 --test examples/support/windows_modules.rs -D warnings -o "${{ runner.temp }}/windows-module-evidence.exe"
          & "${{ runner.temp }}/windows-module-evidence.exe" --test-threads=1 --nocapture
      - name: Observe host and existing Docker prerequisites without mutations
        run: python tools/nemotron-diarization/windows_container_preflight.py --output "${{ runner.temp }}/windows-container-prerequisites"
      - name: Exercise frozen Server Core process-container controls
        run: python tools/nemotron-diarization/windows_container_smoke.py --prerequisites "${{ runner.temp }}/windows-container-prerequisites/preflight.json" --output "${{ runner.temp }}/windows-container-controls"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-container-prerequisites
          path: ${{ runner.temp }}/windows-container-prerequisites/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-container-controls
          path: ${{ runner.temp }}/windows-container-controls/
          retention-days: 7
