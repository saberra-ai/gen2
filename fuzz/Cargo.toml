# Its own workspace: `cargo build` / `cargo test` at the repo root must not
# see this crate, because it only builds under a nightly toolchain with
# `-Z sanitizer` and libFuzzer's runtime.
[workspace]
members = ["."]

[package]
name = "gen2-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

# No inference backend, because nothing here fuzzes one: the `gguf` target
# reaches `ModelInfo::read` and the estimators, which are pure header parsing
# and arithmetic. The default (`backend-llamacpp`) is worse than merely
# wasteful — llama.cpp's `common` bundles `download.cpp`, whose cpp-httplib
# calls are satisfied by nothing in the archive, and libFuzzer's link pulls
# that object in and fails on the undefined `httplib::` symbols. A backend
# still has to be named: `src/backend/mod.rs` makes a backend-less build a
# `compile_error!`. `backend-litertlm` is the one that costs nothing — it
# loads Google's runtime through its C ABI at run time, so it vendors, links
# and downloads nothing at build time, which is exactly what a fuzz build
# wants under a sanitizer.
[dependencies.gen2]
path = ".."
default-features = false
features = ["backend-litertlm"]

[[bin]]
name = "gguf"
path = "fuzz_targets/gguf.rs"
test = false
doc = false
bench = false

# The reply-parts target is written and ready (`fuzz_targets/reply_parts.rs`)
# but NOT wired up: `ChannelMarkers` / `ReplyStateMachine` / `StreamEmission`
# are `pub(crate)`, so an external crate cannot reach them, and widening the
# library's public API for the benefit of a fuzz harness is the crate owner's
# call, not a test's. See fuzz/README.md — enabling it is one re-export line
# plus uncommenting this block. In the meantime that surface is covered by
# `proptest` inside `src/generation/reply_parts.rs`, which also runs in CI.
#
# [[bin]]
# name = "reply_parts"
# path = "fuzz_targets/reply_parts.rs"
# test = false
# doc = false
# bench = false

# `cargo fuzz` builds with debug assertions and overflow checks on, which is
# the point: an arithmetic overflow on header-derived dimensions is a finding,
# not a wrap.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true
