name: Diarization Windows package and container prerequisites
on:
  push:
    branches: [codex/nemotron3-windows-probe]
    paths: ['.github/workflows/diarization-windows-preflight.yml', 'tools/nemotron-diarization/**', 'examples/support/windows_modules.rs']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Preserve byte-pinned source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Run packaging and evidence regressions
        working-directory: tools/nemotron-diarization
        run: python -m unittest test_package_windows test_windows_archive test_windows_pe test_windows_naming test_windows_compat test_windows_loader_control test_windows_container_preflight test_platform_native test_evidence_commands
      - name: Retrieve the exact qualified private-name SDK
        uses: actions/download-artifact@v4
        with:
          name: nemotron-native-windows-2022
          run-id: 38882923286
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qualified-windows-native
      - name: Construct and restore a development runtime from qualified bytes
        run: python tools/nemotron-diarization/package_windows.py --sdk-prefix "${{ runner.temp }}/qualified-windows-native/nemo-sdk" --native-evidence "${{ runner.temp }}/qualified-windows-native/nemo-evidence" --output "${{ runner.temp }}/windows-runtime-package"
      - name: Compile and exercise actual Win32 module snapshots and Unicode relocation
        run: |
          rustc --edition=2024 --test examples/support/windows_modules.rs -D warnings -o "${{ runner.temp }}/windows-module-evidence.exe"
          & "${{ runner.temp }}/windows-module-evidence.exe" --test-threads=1 --nocapture
      - name: Observe host and existing Docker prerequisites without mutations
        run: python tools/nemotron-diarization/windows_container_preflight.py --output "${{ runner.temp }}/windows-container-prerequisites"
      - name: Exercise frozen Server Core process-container controls
        run: python tools/nemotron-diarization/windows_container_smoke.py --prerequisites "${{ runner.temp }}/windows-container-prerequisites/preflight.json" --output "${{ runner.temp }}/windows-container-controls"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-package-development
          path: ${{ runner.temp }}/windows-runtime-package/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-container-prerequisites
          path: ${{ runner.temp }}/windows-container-prerequisites/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-container-controls
          path: ${{ runner.temp }}/windows-container-controls/
          retention-days: 7
