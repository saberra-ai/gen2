name: Diarization Windows graph-only CPU diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graph-cpu:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      GIT_CONFIG_COUNT: '3'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
      GIT_CONFIG_KEY_2: core.longpaths
      GIT_CONFIG_VALUE_2: 'true'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA/NeMo-Speech.cpp
          ref: 083861c241061562b8ec29eb06d7f6cdc3af8775
          path: native-source
          persist-credentials: false
      - name: Initialize pinned GGML source
        run: git -C native-source submodule update --init --depth 1 llama.cpp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Windows dependency cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: nemo-diar-vcpkg-9e593bb18ea69cc5095e012465dcd675a822ed0d-x64-static-md
      - name: Original and contraction compiler controls
        run: python -B -m unittest discover -s tools/nemotron-diarization -p 'test_windows_compiler*.py'
      - name: Source, parser and mock CPU API controls
        run: python -B -m unittest discover -s tools/nemotron-diarization -p test_ggml_graph_cpu_profile.py
      - name: Actual Windows CPU API control
        run: python -B -m unittest discover -s tools/nemotron-diarization -p test_ggml_graph_cpu_windows.py
      - name: Exact diagnostic source, compiler and evidence controls
        run: python -B -m unittest discover -s tools/nemotron-diarization -p test_windows_graph_cpu_profile.py
      - name: Actual owned-background timeout and assignment controls
        run: python -B -m unittest discover -s tools/nemotron-diarization -p test_windows_job_v2.py
      - name: Build isolated diagnostic and run fixed graph and model controls
        run: python -B tools/nemotron-diarization/windows_graph_cpu_profile_diagnostic.py --source native-source --output "${{ runner.temp }}/windows-graph-cpu-profile" --jobs 2
      - name: Preserve successful or failed diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-windows-graph-cpu-profile
          path: |
            ${{ runner.temp }}/windows-graph-cpu-profile/qualification.json
            ${{ runner.temp }}/windows-graph-cpu-profile/protocol.json
            ${{ runner.temp }}/windows-graph-cpu-profile/evidence/
            ${{ runner.temp }}/windows-graph-cpu-profile/sdk/
          include-hidden-files: true
          retention-days: 30
