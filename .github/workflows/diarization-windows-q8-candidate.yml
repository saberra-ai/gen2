name: Diarization Windows Q8 production candidate
on:
  workflow_dispatch:
  push:
    branches: [codex/nemotron3-n0]
    paths:
      - .github/workflows/diarization-windows-q8-candidate.yml
      - tools/nemotron-diarization/windows_q8_candidate*.py
      - tools/nemotron-diarization/windows-q8-candidate*.json
      - tools/nemotron-diarization/test_windows_q8_candidate*.py
      - tools/nemotron-diarization/freeze_windows_q8_candidate.py
permissions:
  contents: read
jobs:
  native-public:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA/NeMo-Speech.cpp
          ref: 083861c241061562b8ec29eb06d7f6cdc3af8775
          path: native-source
          persist-credentials: false
      - name: Initialize pinned GGML source
        run: git -C native-source submodule update --init --depth 1 llama.cpp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Windows dependency cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: nemo-diar-vcpkg-9e593bb18ea69cc5095e012465dcd675a822ed0d-x64-static-md
      - name: Original compiler admission controls
        run: python -m unittest discover -s tools/nemotron-diarization -p 'test_windows_compiler*.py'
      - name: Production candidate source, retention and execution controls
        run: python -m unittest discover -s tools/nemotron-diarization -p 'test_windows_q8_candidate*.py'
      - name: Actual owned-background timeout and assignment controls
        run: python -m unittest discover -s tools/nemotron-diarization -p test_windows_job_v2.py
      - name: Build admitted SDK and run native/public and lifecycle gates
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/windows-q8-candidate-target
        run: python tools/nemotron-diarization/windows_q8_candidate.py --source native-source --output "${{ runner.temp }}/windows-q8-candidate" --jobs 2
      - name: Preserve successful or failed production candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-windows-q8-candidate
          path: |
            ${{ runner.temp }}/windows-q8-candidate/qualification.json
            ${{ runner.temp }}/windows-q8-candidate/protocol.json
            ${{ runner.temp }}/windows-q8-candidate/evidence/
            ${{ runner.temp }}/windows-q8-candidate/sdk/
          include-hidden-files: true
          retention-days: 30
