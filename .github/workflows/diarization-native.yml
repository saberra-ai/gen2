name: Diarization native CPU qualification
on:
  workflow_dispatch:
  push:
    branches: [codex/nemotron3-platforms, codex/nemotron3-linux]
    paths: ['tools/nemotron-diarization/platform_native.py', 'tools/nemotron-diarization/windows_compat.py', 'tools/nemotron-diarization/sdk_archive.py', 'tools/nemotron-diarization/package_linux.py', 'tools/nemotron-diarization/platform_linux_package.py', 'tools/nemotron-diarization/qualify_linux_package.py', '.github/workflows/diarization-native.yml', 'src/diarization/**', 'tests/diarization_native.rs']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        # Linux packaging iteration need not repeat Windows dependency builds.
        os: ${{ fromJSON(github.event_name == 'push' && github.ref_name == 'codex/nemotron3-linux' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Preserve byte-pinned source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA/NeMo-Speech.cpp
          ref: 083861c241061562b8ec29eb06d7f6cdc3af8775
          path: native-source
          persist-credentials: false
      - name: Initialize pinned ggml source
        run: git -C native-source submodule update --init --depth 1 llama.cpp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libsentencepiece-dev
      - name: Windows vcpkg binary cache
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: nemo-diar-vcpkg-9e593bb18ea69cc5095e012465dcd675a822ed0d-x64-static-md
      - name: Build and exercise actual CPU SDK
        run: python tools/nemotron-diarization/platform_native.py --source native-source --prefix "${{ runner.temp }}/nemo-sdk" --output "${{ runner.temp }}/nemo-evidence" --jobs 2
      - name: Linux runtime packaging prerequisites
        if: runner.os == 'Linux' && github.ref_name == 'codex/nemotron3-linux'
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf binutils
      - name: Construct Linux runtime package with corresponding sources
        if: runner.os == 'Linux' && github.ref_name == 'codex/nemotron3-linux'
        run: python tools/nemotron-diarization/platform_linux_package.py --sdk-prefix "${{ runner.temp }}/nemo-sdk" --native-receipt "${{ runner.temp }}/nemo-evidence/receipt.json" --output "${{ runner.temp }}/nemo-package-evidence"
      - name: Exercise delivered Linux runtime in fresh offline containers
        if: runner.os == 'Linux' && github.ref_name == 'codex/nemotron3-linux'
        run: python tools/nemotron-diarization/qualify_linux_package.py --sdk-prefix "${{ runner.temp }}/nemo-sdk" --native-evidence "${{ runner.temp }}/nemo-evidence" --package-evidence "${{ runner.temp }}/nemo-package-evidence" --output "${{ runner.temp }}/nemo-container-evidence"
      - name: Preserve Windows dependency cache after build failure
        if: always() && runner.os == 'Windows' && steps.vcpkg-cache.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: nemo-diar-vcpkg-9e593bb18ea69cc5095e012465dcd675a822ed0d-x64-static-md
      - name: Preserve successful or failed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-native-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/nemo-evidence/*.json
            ${{ runner.temp }}/nemo-evidence/*.log
            ${{ runner.temp }}/nemo-evidence/*.f32
            ${{ runner.temp }}/nemo-evidence/*.tar.gz
            ${{ runner.temp }}/nemo-evidence/reference/
            ${{ runner.temp }}/nemo-sdk/
            ${{ runner.temp }}/nemo-package-evidence/*.json
            ${{ runner.temp }}/nemo-package-evidence/*.log
            ${{ runner.temp }}/nemo-package-evidence/*.tar.gz
            ${{ runner.temp }}/nemo-container-evidence/*.json
            ${{ runner.temp }}/nemo-container-evidence/*.log
            ${{ runner.temp }}/nemo-container-evidence/results/
          retention-days: 7
