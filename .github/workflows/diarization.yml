name: Diarization feature checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/diarization/**', 'src/api/runtime.rs', 'src/api/error.rs', 'src/speech/worker.rs', 'src/lib.rs', 'tests/diarization*.rs', 'tests/speech_cancellation.rs', 'tools/nemotron-diarization/**', 'integrations/pnola/**', 'examples/nemotron*.rs', 'Cargo.*', '.github/workflows/diarization.yml']
  push:
    branches: [main, codex/nemotron3-n0]
    paths: ['src/diarization/**', 'src/api/runtime.rs', 'src/api/error.rs', 'src/speech/worker.rs', 'src/lib.rs', 'tests/diarization*.rs', 'tests/speech_cancellation.rs', 'tools/nemotron-diarization/**', 'integrations/pnola/**', 'examples/nemotron*.rs', 'Cargo.*', '.github/workflows/diarization.yml']
jobs:
  features:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        features: ['', 'backend-diar-nemo', 'asr-dynamic,backend-diar-nemo', 'backend-llamacpp,asr-dynamic,backend-diar-nemo']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package gen2 -- --check
      - run: cargo clippy --locked --no-default-features --features '${{ matrix.features }}' --lib --tests -- -D warnings
      - run: cargo test --locked --no-default-features --features '${{ matrix.features }}' --lib --test diarization_api --test diarization_alignment --test diarization_native --test speech_cancellation
      # Feature compatibility only. No model or native SDK is required here;
      # these jobs never stand in for platform real-model receipts.

  evidence-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen SDK producer source for offline historical admission tests
        run: |
          git fetch --no-tags --depth=1 origin 618d7969b112d1e923e15db19fe81eb2c0b892f4
          git fetch --no-tags --depth=1 origin dfdede8e74709a0c89be01d53aad92d346b50b99
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r tools/nemotron-diarization/evidence-requirements.txt
      - run: python -m unittest discover -s tools/nemotron-diarization -p 'test_*.py'
      - run: python -m unittest discover -s integrations/pnola -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test integrations/pnola/overlay/tests/desktop-assets.test.mjs
