name: Diarization A-packing independent artifact replay
on:
  workflow_dispatch:
  push:
    branches: [codex/nemotron3-n0]
    paths:
      - .github/workflows/diarization-q8-apack-replay.yml
      - tools/nemotron-diarization/remote_q8_apack_replay.py
      - tools/nemotron-diarization/test_remote_q8_apack_replay.py
      - tools/nemotron-diarization/freeze_remote_q8_apack_replay.py
      - tools/nemotron-diarization/remote-q8-apack-replay.protocol.json
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded process, exact API, relocation and real Git bundle controls
        run: python -B -m unittest discover -s tools/nemotron-diarization -p test_remote_q8_apack_replay.py
      - name: Full saved-artifact replay without native execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/nemotron-diarization/remote_q8_apack_replay.py --cache "${{ runner.temp }}/q8-apack-receiver-v1" --output "${{ runner.temp }}/q8-apack-replay-result-v1"
      - name: Preserve successful or failed replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-q8-apack-replay
          path: ${{ runner.temp }}/q8-apack-replay-result-v1/
          include-hidden-files: true
          retention-days: 30
