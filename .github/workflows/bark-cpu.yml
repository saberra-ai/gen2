name: Bark CPU qualification
on:
  workflow_dispatch:
  push:
    branches: [main, codex/bark-onnx]
    paths: ['src/speech/**', 'src/onnx_runtime.rs', 'src/api/runtime.rs', 'src/decision/onnx.rs', 'src/memory/runtime_memory.rs', 'Cargo.*', 'build.rs', 'tools/bark/**', 'tests/bark_native.rs', 'assets/bark/**', '.github/workflows/bark-cpu.yml']
  pull_request:
    paths: ['src/speech/**', 'src/onnx_runtime.rs', 'src/api/runtime.rs', 'src/decision/onnx.rs', 'src/memory/runtime_memory.rs', 'Cargo.*', 'build.rs', 'tools/bark/**', 'tests/bark_native.rs', 'assets/bark/**', '.github/workflows/bark-cpu.yml']
jobs:
  real-model:
    env:
      OPENBLAS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GEN2_BARK_DUMP: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bark-0d5f814-disfluency-b7da294
      - run: python -m pip install --require-hashes -r tools/bark/reference.lock
      - run: python -m pip download --no-deps --require-hashes -r tools/bark/runtime123.lock -d target/bark/old-runtime
      - name: Provision pinned weights and corpus
        run: python tools/bark/provision_reference.py target/bark
      - name: Freeze independent CPU oracle, including token decisions
        run: |
          python tools/bark/qualify_reference.py --skip-candidate-frontend --bundle target/bark/model/onnx --parquet target/bark/test.parquet --output target/bark/oracle
          python tools/bark/export_trace.py --bundle target/bark/model/onnx --reference target/bark/oracle
          python tools/bark/qualify_audio.py --bundle target/bark/model/onnx --fluent target/bark/fluent.parquet --disfluent target/bark/test.parquet --output target/bark/audio
      - name: Locate explicit native runtime and offline inputs
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, zipfile, onnxruntime
          root = pathlib.Path(onnxruntime.__file__).parent / 'capi'
          matches = list(root.glob('onnxruntime.dll')) + list(root.glob('libonnxruntime.so*')) + list(root.glob('libonnxruntime*.dylib'))
          assert matches, f'no native runtime in {root}'
          old_root = pathlib.Path('target/bark/old-runtime')
          with zipfile.ZipFile(next(old_root.glob('*.whl'))) as wheel:
              for name in wheel.namelist():
                  if name.startswith('onnxruntime/capi/') and '..' not in pathlib.PurePosixPath(name).parts:
                      wheel.extract(name, old_root)
          old_capi = old_root / 'onnxruntime/capi'
          old_matches = list(old_capi.glob('onnxruntime.dll')) + list(old_capi.glob('libonnxruntime.so*')) + list(old_capi.glob('libonnxruntime*.dylib'))
          assert old_matches, f'no old native runtime in {old_capi}'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for key, value in {'GEN2_ORT_LIBRARY':matches[0], 'GEN2_ORT_OLD_LIBRARY':old_matches[0].resolve(), 'GEN2_BARK_BUNDLE':pathlib.Path('target/bark/model/onnx').resolve(), 'GEN2_BARK_REFERENCE':pathlib.Path('target/bark/oracle').resolve(), 'GEN2_BARK_RESULTS':pathlib.Path('target/bark/native.json').resolve(), 'GEN2_BARK_AUDIO_REFERENCE':pathlib.Path('target/bark/audio').resolve()}.items():
                  f.write(f'{key}={value}\n')
          PY
      - run: cargo clippy --locked --no-default-features --features asr-dynamic,asr-resample-soxr,laya-dynamic,hf --all-targets -- -D warnings
      - run: cargo test --locked --release --no-default-features --features asr-dynamic,asr-resample-soxr,laya-dynamic --lib
      - run: cargo test --locked --release --no-default-features --features asr-dynamic,asr-resample-soxr,laya-dynamic --test bark_native
      - name: Live resident-memory accounting
        if: runner.os != 'Windows'
        run: cargo test --locked --release --no-default-features --features asr-dynamic --lib snapshot_tracks_released_pages_not_lifetime_peak -- --ignored
      - run: cargo test --locked --release --no-default-features --features asr-dynamic,asr-resample-soxr,laya-dynamic --lib native_frontend -- --ignored
      - run: cargo test --locked --release --no-default-features --features asr-dynamic,asr-resample-soxr,laya-dynamic --lib native_graphs -- --ignored
      - run: cargo test --locked --release --no-default-features --features asr-dynamic --test bark_native incompatible_runtime_is_rejected_before_binding_initialization -- --ignored --exact
      # A 60-second encoder run can leave reusable allocator pages resident.
      # Independent cases get fresh processes; no host admission gate is disabled.
      - name: Real transcripts, audio, integrity and lifecycle
        shell: bash
        run: |
          for test in real_bark_matches_reference_and_reuses_resident_weights real_audio_workflow_matches_qualified_reference real_bundle_integrity_and_warm_offline_cache real_worker_bounds_queue_cancellation_shutdown_and_admission; do
            cargo test --locked --release --no-default-features --features asr-dynamic,asr-resample-soxr,laya-dynamic --test bark_native "$test" -- --ignored --exact
          done
      - run: python tools/bark/compare_results.py --reference target/bark/oracle/reference.json --native target/bark/native.json --output target/bark/qualification.json
      - run: python tools/bark/report_audio.py --reference target/bark/audio/audio-reference.json --native target/bark/audio/native-audio.json --output target/bark/audio-quality.json
      # Each order has a fresh process-global ORT environment.
      - run: cargo test --locked --release --no-default-features --features asr-dynamic,laya-dynamic --test bark_native coexistence_laya_first -- --ignored
      - run: cargo test --locked --release --no-default-features --features asr-dynamic,laya-dynamic --test bark_native coexistence_speech_first -- --ignored
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bark-cpu-${{ matrix.os }}
          path: |
            target/bark/native.json
            target/bark/qualification.json
            target/bark/oracle/reference.json
            target/bark/audio/audio-reference.json
            target/bark/audio/native-audio.json
            target/bark/audio/normalization-errors.json
            target/bark/audio-quality.json
            target/bark/oracle/*.f32
            target/bark/oracle/numpy-runtime.json
          if-no-files-found: error
