name: Diarization Windows math errno diagnostic
on:
  workflow_dispatch:
  push:
    branches: [codex/nemotron3-n0]
    paths:
      - .github/workflows/diarization-windows-math-errno.yml
      - tools/nemotron-diarization/windows_math_errno_diagnostic.py
      - tools/nemotron-diarization/windows_math_errno_metrics.py
      - tools/nemotron-diarization/windows_math_errno_sources.py
      - tools/nemotron-diarization/windows-math-errno.protocol.json
      - tools/nemotron-diarization/test_windows_math_errno.py
      - tools/nemotron-diarization/freeze_windows_math_errno.py
permissions:
  contents: read
jobs:
  compilers:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA/NeMo-Speech.cpp
          ref: 083861c241061562b8ec29eb06d7f6cdc3af8775
          path: native-source
          persist-credentials: false
      - name: Initialize pinned GGML source
        run: git -C native-source submodule update --init --depth 1 llama.cpp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Windows dependency cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: nemo-diar-vcpkg-9e593bb18ea69cc5095e012465dcd675a822ed0d-x64-static-md
      - name: Original and contraction compiler controls
        run: python -m unittest discover -s tools/nemotron-diarization -p 'test_windows_compiler*.py'
      - name: Math errno derivation and admission controls
        run: python -m unittest discover -s tools/nemotron-diarization -p test_windows_math_errno.py
      - name: Actual owned-background timeout and assignment controls
        run: python -m unittest discover -s tools/nemotron-diarization -p test_windows_job_v2.py
      - name: Build admitted SDKs and run fixed math errno sequence
        run: python tools/nemotron-diarization/windows_math_errno_diagnostic.py --source native-source --output "${{ runner.temp }}/windows-math-errno" --jobs 2
      - name: Preserve successful or failed math errno evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-windows-math-errno
          path: |
            ${{ runner.temp }}/windows-math-errno/qualification.json
            ${{ runner.temp }}/windows-math-errno/protocol.json
            ${{ runner.temp }}/windows-math-errno/evidence-*/
            ${{ runner.temp }}/windows-math-errno/sdk-*/
          include-hidden-files: true
          retention-days: 30
