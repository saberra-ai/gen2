name: Diarization Windows native compiler diagnostic v2
on:
  workflow_dispatch:
  push:
    branches: [codex/nemotron3-n0]
    paths:
      - .github/workflows/diarization-windows-compiler-diagnostic-v2.yml
      - tools/nemotron-diarization/windows_compiler_diagnostic_v2.py
      - tools/nemotron-diarization/windows_compiler_v2_sources.py
      - tools/nemotron-diarization/windows_job_v2.py
      - tools/nemotron-diarization/windows-compiler-diagnostic-v2.protocol.json
permissions:
  contents: read
jobs:
  compilers:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA/NeMo-Speech.cpp
          ref: 083861c241061562b8ec29eb06d7f6cdc3af8775
          path: native-source
          persist-credentials: false
      - name: Initialize pinned GGML source
        run: git -C native-source submodule update --init --depth 1 llama.cpp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Windows dependency cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: nemo-diar-vcpkg-9e593bb18ea69cc5095e012465dcd675a822ed0d-x64-static-md
      - name: Original and versioned compiler controls
        run: python -m unittest discover -s tools/nemotron-diarization -p 'test_windows_compiler_diagnostic*.py'
      - name: Actual Windows normal-background timeout and assignment controls
        run: python -m unittest discover -s tools/nemotron-diarization -p test_windows_job_v2.py
      - name: Build both admitted SDKs and run original fixed compiler sequence
        run: python tools/nemotron-diarization/windows_compiler_diagnostic_v2.py --source native-source --output "${{ runner.temp }}/windows-compiler-diagnostic-v2" --jobs 2
      - name: Preserve successful or failed versioned compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-windows-compiler-diagnostic-v2
          path: |
            ${{ runner.temp }}/windows-compiler-diagnostic-v2/qualification.json
            ${{ runner.temp }}/windows-compiler-diagnostic-v2/protocol.json
            ${{ runner.temp }}/windows-compiler-diagnostic-v2/evidence-*/
            ${{ runner.temp }}/windows-compiler-diagnostic-v2/sdk-*/
          include-hidden-files: true
          retention-days: 30
