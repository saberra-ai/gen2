name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, for the jobs too slow to gate a PR on.
    - cron: "0 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  # The default build, which is what a consumer gets from `cargo add gen2`:
  # llama.cpp, and so a C toolchain.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the C toolchain llama.cpp needs
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      # Every file, not just the ones the default features reach: `cargo fmt`
      # follows the module tree, so a module behind an inactive `#[cfg]` is
      # skipped locally and only shows up here.
      - run: find src -name '*.rs' -print0 | xargs -0 rustfmt --edition 2024 --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The async API, which is a separate compilation of the same crate. Runs on
  # the external-api backend rather than the default: what it exercises is the
  # `Stream` layer, and paying a llama.cpp build for that buys nothing.
  tokio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --no-default-features --features backend-external-api,tokio -- -D warnings
      - run: cargo test --no-default-features --features backend-external-api,tokio

  # Every backend the README lists, built the way the README says to build it.
  # A backend that only compiles alongside another one is not a backend.
  backends:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, features: backend-external-api }
          - { os: ubuntu-latest, features: backend-llamacpp }
          - { os: ubuntu-latest, features: backend-mistralrs }
          # LiteRT-LM loads Google's runtime at run time, so a build needs
          # nothing installed — which is exactly the property worth checking on
          # two platforms.
          - { os: ubuntu-latest, features: backend-litertlm }
          - { os: macos-latest, features: backend-litertlm }
          # Two backends, two formats. Proves `.gguf` still goes to llama.cpp
          # once LiteRT-LM is compiled in beside it.
          - { os: ubuntu-latest, features: "backend-llamacpp,backend-litertlm" }
          - { os: macos-latest, features: metal }
          - { os: macos-latest, features: "metal,tokio" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the C toolchain llama.cpp needs
        if: contains(matrix.features, 'llamacpp') || contains(matrix.features, 'metal') || contains(matrix.features, 'mlx')
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y cmake libclang-dev
          else
            brew install cmake
          fi
      - run: cargo clippy --all-targets --no-default-features --features ${{ matrix.features }} -- -D warnings
      # Not only clippy. A unit test compiled only under a non-default backend
      # is a test nothing runs otherwise, and one of them had been failing
      # unnoticed because every command that would have caught it used the
      # default feature set.
      - run: cargo test --no-default-features --features ${{ matrix.features }}

  # The mobile lane has to actually compile for a mobile target.
  #
  # `ios`/`android` naming a backend proves nothing on its own — the interesting
  # claim is that LiteRT-LM cross-compiles with nothing installed, because it
  # links no native library and loads Google's runtime through a C ABI at run
  # time. So the LiteRT-only build is checked first and on its own: it is the
  # one that should need no toolchain beyond rustup.
  #
  # The full `ios`/`android` bundles are checked too, and those DO need a C
  # toolchain — not for LiteRT-LM, but because llama.cpp compiles C++ and
  # `tokenizers` pulls in `onig_sys`. That is a pre-existing property of any
  # gen2 mobile build, which is why the two are separate jobs rather than one.
  mobile-targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-ios, features: backend-litertlm }
          - { os: ubuntu-latest, target: aarch64-linux-android, features: backend-litertlm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Point cc at the Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          # `tokenizers` depends on `onig_sys`, which compiles C. Every Android
          # build of gen2 has always needed this, whatever the backend.
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - run: >
          cargo check --target ${{ matrix.target }}
          --no-default-features --features ${{ matrix.features }}

  # Whether this could be published at all.
  #
  # crates.io does not accept a package whose dependencies resolve only to git
  # repositories. The root crate's no longer do — the backend that needed one
  # moved to the unpublished companion under `crates/` — and this keeps it
  # that way: the check is cheap and the answer only changes when the
  # manifest does.
  # A hard gate since S1.4: every dependency resolves from crates.io, and a
  # change that reintroduces a git-only one fails here rather than at release.
  publishable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the C toolchain llama.cpp needs
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - name: cargo publish --dry-run
        run: |
          if cargo publish --dry-run --allow-dirty 2>&1 | tee /tmp/publish.log; then
            echo "publishable"
          else
            echo "::error::not publishable to crates.io — see the log"
            grep -iE "git|registry|version" /tmp/publish.log | head -20 || true
            exit 1
          fi

  # A build with no backend feature must compile and its plugin seam must
  # work: a consumer that brings its own backend through
  # `gen2::advanced::plugin` (the companion crate under `crates/` is one)
  # enables no `backend-*` feature at all. This used to be a compile error by
  # design; it is a run-time error now, at the first load nothing claims.
  no-backend-build-still-works:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features --lib advanced::

  # The fuzz targets live in their own workspace on a nightly toolchain, so
  # nothing in the ordinary build would notice them breaking. Building them is
  # enough to catch that; running them is a nightly job's business, not a PR's.
  fuzz-targets-still-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build gguf
        working-directory: fuzz

  # MLX builds and generates locally on macOS 26.3 with the Metal Toolchain
  # installed; whether a stock runner has that component is still open. On the
  # weekly schedule rather than per-PR because it is the most expensive job in
  # the file — a macOS runner billed at ten times Linux, running a long native
  # MLX build — and the answer does not change between commits.
  mlx-builds-on-a-clean-machine:
    if: github.event_name == 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install cmake
      - run: cargo clippy --all-targets --no-default-features --features backend-mlx -- -D warnings

  # Coverage-guided fuzzing, on a schedule rather than per-PR: a PR should not
  # wait on it, and a corpus is worth more when it accumulates.
  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz the GGUF parser
        run: cargo fuzz run gguf -- -max_total_time=900
        working-directory: fuzz
      - name: Keep any crash for triage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
