name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, for the jobs too slow to gate a PR on.
    - cron: "0 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  # The default build: external-api backend, no C toolchain, everything the
  # unit and doc tests cover.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Every file, not just the ones the default features reach: `cargo fmt`
      # follows the module tree, so a module behind an inactive `#[cfg]` is
      # skipped locally and only shows up here.
      - run: find src -name '*.rs' -print0 | xargs -0 rustfmt --edition 2024 --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The async API, which is a separate compilation of the same crate.
  tokio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features tokio -- -D warnings
      - run: cargo test --features tokio

  # Every backend the README lists, built the way the README says to build it.
  # A backend that only compiles alongside another one is not a backend.
  backends:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, features: backend-external-api }
          - { os: ubuntu-latest, features: backend-executorch }
          - { os: ubuntu-latest, features: backend-candle }
          - { os: ubuntu-latest, features: backend-onnx }
          - { os: ubuntu-latest, features: backend-llamacpp }
          - { os: macos-latest, features: metal }
          - { os: macos-latest, features: "metal,tokio" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the C toolchain llama.cpp needs
        if: contains(matrix.features, 'llamacpp') || contains(matrix.features, 'metal')
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y cmake libclang-dev
          else
            brew install cmake
          fi
      - run: cargo clippy --all-targets --no-default-features --features ${{ matrix.features }} -- -D warnings
      # Not only clippy. A unit test compiled only under a non-default backend
      # is a test nothing runs otherwise, and one of them had been failing
      # unnoticed because every command that would have caught it used the
      # default feature set.
      - run: cargo test --lib --no-default-features --features ${{ matrix.features }}

  # A build with no backend must fail, loudly, at compile time. If this job
  # ever passes, the guard that produces that error has gone missing.
  no-backend-is-a-compile-error:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          if cargo check --no-default-features 2>/dev/null; then
            echo "::error::a build with no backend feature compiled; the guard is gone"
            exit 1
          fi

  # The fuzz targets live in their own workspace on a nightly toolchain, so
  # nothing in the ordinary build would notice them breaking. Building them is
  # enough to catch that; running them is a nightly job's business, not a PR's.
  fuzz-targets-still-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build gguf
        working-directory: fuzz

  # Coverage-guided fuzzing, on a schedule rather than per-PR: a PR should not
  # wait on it, and a corpus is worth more when it accumulates.
  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz the GGUF parser
        run: cargo fuzz run gguf -- -max_total_time=900
        working-directory: fuzz
      - name: Keep any crash for triage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
